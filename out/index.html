<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSSI en Afrique - Vidéo Remotion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 2.2em;
      margin-bottom: 10px;
      color: #00d4aa;
    }
    .subtitle {
      text-align: center;
      color: #b0bec5;
      font-size: 1.1em;
      margin-bottom: 40px;
    }
    .video-section {
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
    }
    video {
      width: 100%;
      border-radius: 12px;
      display: block;
    }
    h2 {
      color: #ffd700;
      font-size: 1.5em;
      margin: 30px 0 20px;
      text-align: center;
    }
    .scenes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .scene-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,212,170,0.2);
      border-radius: 12px;
      overflow: hidden;
    }
    .scene-card img {
      width: 100%;
      display: block;
    }
    .scene-card .label {
      padding: 12px 16px;
      font-weight: 600;
      color: #00d4aa;
      font-size: 0.95em;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #607d8b;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 RSSI en Afrique</h1>
    <p class="subtitle">Vidéo générée avec Remotion — Received Signal Strength Indicator</p>

    <div class="video-section">
      <video controls autoplay muted playsinline>
        <source src="rssi-afrique.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la lecture vidéo.
      </video>
    </div>

    <h2>Aperçu des scènes</h2>
    <div class="scenes">
      <div class="scene-card">
        <img src="scene1-title.png" alt="Scène 1 - Titre">
        <div class="label">1. Écran titre</div>
      </div>
      <div class="scene-card">
        <img src="scene2-whatisrssi.png" alt="Scène 2 - Qu'est-ce que le RSSI">
        <div class="label">2. Qu'est-ce que le RSSI ?</div>
      </div>
      <div class="scene-card">
        <img src="scene3-stats.png" alt="Scène 3 - Chiffres clés">
        <div class="label">3. Chiffres clés en Afrique</div>
      </div>
      <div class="scene-card">
        <img src="scene4-challenges.png" alt="Scène 4 - Défis">
        <div class="label">4. Défis du RSSI</div>
      </div>
      <div class="scene-card">
        <img src="scene5-closing.png" alt="Scène 5 - Conclusion">
        <div class="label">5. Conclusion</div>
      </div>
    </div>

    <footer>Généré avec Remotion • Blog-Tutorial par Josue Romba</footer>
  </div>
</body>
</html>
